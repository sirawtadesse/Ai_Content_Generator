{% extends 'base.html' %} {% load static %} {% block content %}
<!-- Contact Section with gradient background and centered form -->
<section class="py-5" style="background: linear-gradient(135deg, #11cdef, #5e72e4);">
    <div class="container animate__animated animate__fadeInUp">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 bg-white p-5 rounded shadow">
                <h1 class="text-center mb-4" style="color: #5e72e4;">Contact Us</h1>
                {% if messages %} {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
                </div>
                {% endfor %} {% endif %}
                <form method="post">
                    {% csrf_token %} {{ form.as_p }}
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
