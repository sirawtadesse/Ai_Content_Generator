{% extends 'base.html' %} {% load static %} {% block content %}
<div class="container mt-5 animate__animated animate__fadeInUp">
    <h1 class="mb-4 text-center">Blog Posts</h1>
    <form method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="q" class="form-control" placeholder="Search blog posts">
            <div class="input-group-append">
                <button type="submit" class="btn btn-secondary">Search</button>
            </div>
        </div>
    </form>
    {% for post in posts %}
    <div class="card mb-3 animate__animated animate__fadeInUp">
        {% if post.image %}
        <img src="{{ post.image.url }}" class="card-img-top" alt="{{ post.title }}"> {% endif %}
        <div class="card-body">
            <h5 class="card-title">{{ post.title }}</h5>
            <p class="card-text">{{ post.content|truncatewords:30 }}</p>
            <a href="{% url 'blog_detail' post.pk %}" class="btn btn-primary">Read More</a>
        </div>
    </div>
    {% empty %}
    <p>No blog posts found.</p>
    {% endfor %}
</div>
{% endblock %}
