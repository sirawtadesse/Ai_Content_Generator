{% extends 'base.html' %} {% load static %} {% block content %}
<div class="container mt-5 animate__animated animate__fadeIn">
    <h1 class="mb-4">{{ post.title }}</h1>
    {% if post.image %}
    <img src="{{ post.image.url }}" alt="{{ post.title }}" class="img-fluid mb-4 rounded shadow"> {% endif %}
    <p class="mt-3 lead">{{ post.content }}</p>
    <p class="mt-3"><strong>Category:</strong> {{ post.category }}</p>
    <p><small class="text-muted">Published on {{ post.created_at|date:"M d, Y" }}</small></p>
    <a href="{% url 'blog_list' %}" class="btn btn-secondary mt-3">Back to Blog List</a>
</div>
{% endblock %}
